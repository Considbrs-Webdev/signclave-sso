name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, ldap, openssl
          coverage: none
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ""
          COMPOSER_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          composer config --unset --global github-oauth.github.com || true
          composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: Unit and security tests
        run: vendor/bin/pest --configuration=phpunit.xml.dist

      - name: Type coverage
        run: vendor/bin/pest --configuration=phpunit.xml.dist --type-coverage --min=100

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G
