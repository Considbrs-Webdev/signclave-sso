name: Composer audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, ldap, openssl
          coverage: none
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ""
          COMPOSER_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          composer config --unset --global github-oauth.github.com || true
          composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        run: composer audit
